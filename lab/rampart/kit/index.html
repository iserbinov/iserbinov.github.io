<style>
/* Kit page layout. Values are tokens too. */
.k{max-width:1200px;margin:0 auto;padding:var(--r-space-8) var(--r-space-4) var(--r-space-16);display:flex;flex-direction:column;gap:var(--r-space-12)}
.k-head{display:flex;justify-content:space-between;align-items:center;gap:var(--r-space-4);flex-wrap:wrap}
.k-head__tools{display:flex;gap:var(--r-space-3);align-items:center;flex-wrap:wrap}
.k-intro{display:flex;flex-direction:column;gap:var(--r-space-3);max-width:72ch}
.k-section{display:flex;flex-direction:column;gap:var(--r-space-5)}
.k-section>h2{font:var(--r-type-heading-m);margin:0;padding-top:var(--r-space-4);border-top:1px solid var(--r-divider-line)}
.k-nav{display:flex;gap:var(--r-space-4);flex-wrap:wrap}
.k-pair{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--r-border-subtle);border-radius:var(--r-radius-l);overflow:hidden}
.k-pane{background:var(--r-bg-surface);color:var(--r-text-primary);padding:var(--r-space-6);display:flex;flex-direction:column;gap:var(--r-space-4);min-width:0}
.k-pane__label{font:var(--r-type-caption);color:var(--r-text-secondary);text-transform:uppercase;letter-spacing:.06em;margin:0}
:lang(ar) .k-pane__label{letter-spacing:0}
.k-row{display:flex;flex-wrap:wrap;gap:var(--r-space-3);align-items:flex-start}
.k-cell{display:flex;flex-direction:column;gap:var(--r-space-2);min-width:0}
.k-cell>.k-state{font:var(--r-type-caption);color:var(--r-text-secondary);margin:0}
.k-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--r-space-4)}
.k-table-wrap{overflow-x:auto;border:1px solid var(--r-border-subtle);border-radius:var(--r-radius-l)}
.k-table{width:100%;border-collapse:collapse;font:var(--r-type-body-s);background:var(--r-bg-surface)}
.k-table th,.k-table td{text-align:start;padding:var(--r-space-2) var(--r-space-3);border-bottom:1px solid var(--r-border-subtle);vertical-align:middle;white-space:nowrap}
.k-table th{font:var(--r-type-label-m);color:var(--r-text-secondary);background:var(--r-bg-subtle);position:sticky;top:0}
.k-table code,.k-code{font-family:var(--r-font-family-mono);font-size:var(--r-font-size-12)}
.k-sw{display:inline-flex;align-items:center;gap:var(--r-space-2)}
.k-sw i{width:20px;height:20px;border-radius:var(--r-radius-s);border:1px solid var(--r-border-subtle);display:inline-block;flex:none}
.k-ok{color:var(--r-status-success)}
.k-bad{color:var(--r-status-error)}
.k-scale{display:flex;gap:var(--r-space-1);flex-wrap:wrap}
.k-scale div{display:flex;flex-direction:column;gap:var(--r-space-1);font:var(--r-type-caption);color:var(--r-text-secondary);width:72px}
.k-scale i{height:48px;border-radius:var(--r-radius-m);border:1px solid var(--r-border-subtle)}
.k-type{display:flex;flex-direction:column;gap:var(--r-space-3)}
.k-type>div{display:grid;grid-template-columns:140px 1fr;gap:var(--r-space-4);align-items:baseline}
@media (max-width:760px){.k-pair{grid-template-columns:1fr}.k-type>div{grid-template-columns:1fr}}
</style>
<script type="module" src="kit.js"></script>
</head>
<body><div id="kit"></div><script data-goatcounter="https://serbinov.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
